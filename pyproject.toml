[project]
name = "jsonapy"
version = "0.1.0"
description = "Declarative JSON:API resources, query handling, and framework adapters for Python"
readme = "README.md"
keywords = ["jsonapi", "json-api", "resources", "fastapi", "sqlalchemy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
authors = [
    {name = "Omar Zabaneh", email = "zabano@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.13.4,<3"]
fastapi = ["fastapi>=0.115,<1", "pydantic>=2.13.4,<3"]
sqlalchemy = ["sqlalchemy>=2.0.51,<3"]
all = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13.4,<3",
    "sqlalchemy>=2.0.51,<3",
]
dev = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13.4,<3",
    "sqlalchemy>=2.0.51,<3",
    "pytest>=9.1.1,<10",
    "mypy>=1.20,<2",
    "httpx>=0.27,<1",
    "build>=1.2,<2",
    "twine>=6,<8",
]

[dependency-groups]
dev = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13.4,<3",
    "sqlalchemy>=2.0.51,<3",
    "pytest>=9.1.1,<10",
    "mypy>=1.20,<2",
    "httpx>=0.27,<1",
    "build>=1.2,<2",
    "twine>=6,<8",
]

[tool.poetry]
packages = [
    {include = "jsonapy", from = "src"},
]
include = [
    {path = "docs", format = ["sdist"]},
    {path = "tests", format = ["sdist"]},
    {path = "scripts", format = ["sdist"]},
    {path = "AGENTS.md", format = ["sdist"]},
    {path = "pytest.ini", format = ["sdist"]},
]

[tool.mypy]
python_version = "3.12"
files = ["src/jsonapy", "tests/typing", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_reexport = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
