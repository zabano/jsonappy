name: Tests and packaging

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m mypy
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test installed wheel and dependency-free core
        run: |
          python -m venv /tmp/jsonapy-core
          /tmp/jsonapy-core/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/jsonapy-core/bin/python -I -c "from importlib.resources import files; from jsonapy import Resource; from jsonapy.query import QuerySpec; assert files('jsonapy').joinpath('py.typed').is_file(); print(QuerySpec())"
